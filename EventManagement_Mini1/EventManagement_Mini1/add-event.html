<!DOCTYPE html>
<html>

<head>
<title>Admin - Manage Events</title>
<link rel="stylesheet" href="./css/style.css">
</head>

<body>

<h1>Admin Panel</h1>

<h2>Add Event</h2>

<form id="eventForm">

<input type="text" id="title" placeholder="Title" required>

<input type="text" id="description" placeholder="Description">

<input type="date" id="date" required>

<input type="text" id="location" placeholder="Location" required>

<input type="number" id="capacity" placeholder="Capacity" required>

<button type="submit">Add Event</button>

</form>

<hr>

<h2>Admin Event List</h2>

<div id="adminEvents"></div>


<script type="module">

import {addEvent,getEvents,deleteEvent} from "./js/services/apiService.js"

const form=document.getElementById("eventForm")
const adminEvents=document.getElementById("adminEvents")

// ADD EVENT
form.addEventListener("submit",async(e)=>{

e.preventDefault()

const title=document.getElementById("title").value
const description=document.getElementById("description").value
const date=document.getElementById("date").value
const location=document.getElementById("location").value
const capacity=Number(document.getElementById("capacity").value)

const event={
title,
description,
date,
location,
capacity,
availableSeats:capacity
}

await addEvent(event)

alert("Event Added Successfully")

form.reset()

loadEvents()

})


// LOAD EVENTS
async function loadEvents(){

const events=await getEvents()

adminEvents.innerHTML=""

events.forEach(event=>{

const div=document.createElement("div")

div.innerHTML=`
<h3>${event.title}</h3>
<p>${event.description}</p>
<p>Date: ${event.date}</p>
<p>Location: ${event.location}</p>
<p>Seats Available: ${event.availableSeats}</p>

<button class="deleteBtn">Delete</button>

<hr>
`

const deleteBtn=div.querySelector(".deleteBtn")

deleteBtn.addEventListener("click",async()=>{

const confirmDelete=confirm("Delete this event?")

if(!confirmDelete) return

await deleteEvent(event.id)

alert("Event Deleted Successfully")

loadEvents()

})

adminEvents.appendChild(div)

})

}

// INITIAL LOAD
loadEvents()

</script>

</body>

</html>

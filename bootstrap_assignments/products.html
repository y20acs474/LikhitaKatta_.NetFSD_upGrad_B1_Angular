<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Product Listing</title>


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-4">

<h2 class="text-center mb-4">Electronics Store</h2>

<div class="row g-4">


<div class="col-12 col-md-6 col-lg-3">
<div class="card h-100">
<img src="https://via.placeholder.com/300" class="card-img-top">
<div class="card-body text-center">
<h5 class="card-title">Mobile</h5>
<p class="card-text">Latest smartphone</p>
<button class="btn btn-primary">Add to Cart</button>
<button class="btn btn-outline-secondary">View</button>
</div>
</div>
</div>

<div class="col-12 col-md-6 col-lg-3">
<div class="card h-100">
<img src="product3.jpg" class="card-img-top">
<div class="card-body text-center">
<h5 class="card-title">Laptop</h5>
<p class="card-text">High performance laptop</p>
<button class="btn btn-primary">Add to Cart</button>
<button class="btn btn-outline-secondary">View</button>
</div>
</div>
</div>


<div class="col-12 col-md-6 col-lg-3">
<div class="card h-100">
<img src="product1.jpg" class="card-img-top">
<div class="card-body text-center">
<h5 class="card-title">Headphones</h5>
<p class="card-text">Noise cancelling</p>
<button class="btn btn-primary">Add to Cart</button>
<button class="btn btn-outline-secondary">View</button>
</div>
</div>
</div>


<div class="col-12 col-md-6 col-lg-3">
<div class="card h-100">
<img src="https://via.placeholder.com/300" class="card-img-top">
<div class="card-body text-center">
<h5 class="card-title">Smart Watch</h5>

<button class="btn btn-primary">Add to Cart</button>
<button class="btn btn-outline-secondary">View</button>
</div>
</div>
</div>

</div>
</div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ecommerce Landing Page</title>


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>


<nav class="navbar navbar-dark bg-dark">
<div class="container-fluid">
<a class="navbar-brand" href="#">My Store</a>

<button class="navbar-toggler" data-bs-toggle="offcanvas" data-bs-target="#menu">
<span class="navbar-toggler-icon"></span>
</button>
</div>
</nav>


<div class="offcanvas offcanvas-start" id="menu">
<div class="offcanvas-header">
<h5>Menu</h5>
<button class="btn-close" data-bs-dismiss="offcanvas"></button>
</div>

<div class="offcanvas-body">
<a class="d-block mb-2">Home</a>
<a class="d-block mb-2">Products</a>
<a class="d-block">Contact</a>
</div>
</div>


<div id="slider" class="carousel slide mt-3">

<div class="carousel-inner">

<div class="carousel-item active">
<img src="https://via.placeholder.com/1200x400" class="d-block w-100">
</div>

<div class="carousel-item">
<img src="https://via.placeholder.com/1200x400" class="d-block w-100">
</div>

</div>

<button class="carousel-control-prev" data-bs-target="#slider" data-bs-slide="prev">
<span class="carousel-control-prev-icon"></span>
</button>

<button class="carousel-control-next" data-bs-target="#slider" data-bs-slide="next">
<span class="carousel-control-next-icon"></span>
</button>

</div>


<div class="container mt-5">
<div class="row g-4">

<div class="col-md-4">
<div class="card p-3 text-center">Product 1</div>
</div>

<div class="col-md-4">
<div class="card p-3 text-center">Product 2</div>
</div>

<div class="col-md-4">
<div class="card p-3 text-center">Product 3</div>
</div>

</div>
</div>


<div class="container mt-5">
<h4>Subscribe</h4>
<input class="form-control mb-2" placeholder="Enter email">
<button class="btn btn-primary">Subscribe</button>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>

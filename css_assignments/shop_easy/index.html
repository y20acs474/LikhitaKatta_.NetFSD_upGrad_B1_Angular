<!DOCTYPE html>
<html>
<head>
    <title>ShopEasy</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>ShopEasy</h1>
    <nav>
        <a href="#">Home</a>
        <a href="#">Products</a>
        <a href="#">Cart</a>
    </nav>
</header>

<section class="container">

   
    <aside class="sidebar">
        <h2>Filters</h2>
        <label><input type="checkbox"> Electronics</label><br>
        <label><input type="checkbox"> Clothing</label><br>
        <label><input type="checkbox"> Accessories</label>
    </aside>

   
    <section class="products">

        <div class="product-card">
            <span style="background:red; color:white; padding:3px;">Limited Offer</span>
            <img src="images/product1.jpg" alt="Product 1">
            <h3>Headphones</h3>
            <button>Add to Cart</button>
        </div>

        <div class="product-card">
            <img src="images/product3.jpg" alt="Product 2">
            <h3>Laptop</h3>
            <button>Add to Cart</button>
        </div>

        <div class="product-card">
            <img src="images/product2.jpg" alt="Product 3">
            <h3>Shoes</h3>
            <button>Add to Cart</button>
        </div>

    </section>

</section>

<section id="cart">
    <h2>Shopping Cart Summary</h2>
    <p>Items: 0</p>
</section>

<footer>
    <p>© 2026 ShopEasy</p>
</footer>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>SecureBank</title>
    <link rel="stylesheet" href="style.css">

    
    <style>
        .highlight-balance {
            background-color: lightgreen;
            font-weight: bold;
        }
    </style>
</head>
<body>


<div style="background:red; color:white; padding:10px; text-align:center;">
    Warning: Unauthorized access is prohibited!
</div>

<header>
    <h1>SecureBank Dashboard</h1>
</header>

<div class="dashboard">

   
    <aside class="sidebar">
        <ul>
            <li>Home</li>
            <li>Accounts</li>
            <li>Transactions</li>
        </ul>
    </aside>

   
    <main>

        
        <section class="cards">
            <div class="card highlight-balance">
                <h3>Account Balance</h3>
                <p>$10,000</p>
            </div>

            <div class="card">
                <h3>Savings</h3>
                <p>$5,000</p>
            </div>
        </section>

        
        <section>
            <h2>Recent Transactions</h2>
            <table border="1">
                <tr>
                    <th>Date</th>
                    <th>Type</th>
                    <th>Amount</th>
                </tr>
                <tr>
                    <td>01/01/2026</td>
                    <td class="credit">Credit</td>
                    <td>$500</td>
                </tr>
                <tr>
                    <td>02/01/2026</td>
                    <td class="debit">Debit</td>
                    <td>$200</td>
                </tr>
            </table>
        </section>

        
        <section>
            <h2>Login</h2>
            <form>
                <input type="text" placeholder="Username"><br><br>
                <input type="password" placeholder="Password"><br><br>
                <button>Login</button>
            </form>
        </section>

    </main>
</div>

<footer>
    <p>© 2026 SecureBank</p>
</footer>

</body>
</html>
